<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121624" />
      <stop offset="100%" stop-color="#090b12" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#pulseGradient)" stroke-width="2.5" />

  <!-- Outer Pulse Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#pulseGradient)" stroke-width="1.5" stroke-dasharray="4, 4" opacity="0.4" />

  <!-- Neural Synapse Pathway Nodes -->
  <!-- Center Core -->
  <circle cx="50" cy="50" r="10" fill="url(#pulseGradient)" filter="url(#neonGlow)" />
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />

  <!-- Satellite Nodes -->
  <!-- Top Node -->
  <circle cx="50" cy="24" r="5" fill="#00f0ff" filter="url(#neonGlow)" />
  <!-- Bottom Node -->
  <circle cx="50" cy="76" r="5" fill="#a855f7" filter="url(#neonGlow)" />
  <!-- Top-Right Node -->
  <circle cx="73" cy="38" r="5.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <!-- Bottom-Right Node -->
  <circle cx="73" cy="62" r="5" fill="#a855f7" filter="url(#neonGlow)" />
  <!-- Top-Left Node -->
  <circle cx="27" cy="38" r="5.5" fill="#00f0ff" filter="url(#neonGlow)" />
  <!-- Bottom-Left Node -->
  <circle cx="27" cy="62" r="5" fill="#818cf8" filter="url(#neonGlow)" />

  <!-- Synaptic Connective Filaments -->
  <path d="M 50 50 L 50 24" stroke="url(#pulseGradient)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 50 L 50 76" stroke="url(#pulseGradient)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 50 L 73 38" stroke="url(#pulseGradient)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 50 L 73 62" stroke="url(#pulseGradient)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 50 L 27 38" stroke="url(#pulseGradient)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 50 50 L 27 62" stroke="url(#pulseGradient)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Outer Arc Cross Connections -->
  <path d="M 27 38 Q 50 18 73 38" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
  <path d="M 27 62 Q 50 82 73 62" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
</svg>
